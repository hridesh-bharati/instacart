name: Build Android APK and Publish Update

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install Dependencies
        run: npm install

      - name: Build Production APK with EAS
        run: npx eas build --platform android --profile production --non-interactive --auto-submit=false
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}